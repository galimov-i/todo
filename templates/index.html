<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board with Time Tracking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <h1>Kanban Board</h1>
        <button id="add-task-btn" class="btn btn-primary">+ Add Task</button>
    </header>

    <main class="board">
        {% for status, display_name in columns.items() %}
        <div class="column" data-status="{{ status }}">
            <div class="column-header">
                <h2>{{ display_name }}</h2>
                <span class="task-count">0</span>
            </div>
            <div class="task-list" data-status="{{ status }}">
                <!-- Tasks will be loaded dynamically -->
            </div>
        </div>
        {% endfor %}
    </main>

    <!-- Add/Edit Task Modal -->
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Task</h3>
                <button class="modal-close">&times;</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id" value="">
                <div class="form-group">
                    <label for="task-title">Title *</label>
                    <input type="text" id="task-title" required placeholder="Enter task title">
                </div>
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" rows="3" placeholder="Enter task description (optional)"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Task Details Modal -->
    <div id="details-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="details-title">Task Details</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="task-details">
                <div class="detail-section">
                    <h4>Description</h4>
                    <p id="details-description">No description</p>
                </div>
                <div class="detail-section">
                    <h4>Time Tracking</h4>
                    <div class="time-display">
                        <span class="time-label">Total Time:</span>
                        <span id="details-total-time" class="time-value">00:00:00</span>
                    </div>
                </div>
                <div class="detail-section">
                    <h4>Time Entries</h4>
                    <div id="time-entries-list" class="time-entries">
                        <!-- Time entries will be loaded here -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="edit-task-btn">Edit</button>
                <button class="btn btn-danger" id="delete-task-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Confirm Delete</h3>
                <button class="modal-close">&times;</button>
            </div>
            <p>Are you sure you want to delete this task? This action cannot be undone.</p>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="confirm-cancel-btn">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/kanban.js') }}"></script>
</body>
</html>
